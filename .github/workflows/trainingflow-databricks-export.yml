name: TrainingFlow — Export Supabase to Parquet

on:
  # Run at 02:00 UTC daily (10:00 AWST / 10:00 SGT)
  schedule:
    - cron: "0 2 * * *"

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  export:
    name: Export Supabase Tables → Parquet Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout repo
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -----------------------------------------------------------------------
      # 3. Install dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r trainingflow-analytics/ingestion/requirements.txt

      # -----------------------------------------------------------------------
      # 4. Export Supabase tables to Parquet files
      #
      # Secret required:
      #   SUPABASE_POOLER_URL  — Transaction pooler URI from Supabase
      #                          Connect button → Direct → Transaction pooler tab
      # -----------------------------------------------------------------------
      - name: Export Supabase tables to Parquet
        env:
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          OUTPUT_DIR: parquet_output
        run: |
          python trainingflow-analytics/ingestion/export_to_databricks.py

      # -----------------------------------------------------------------------
      # 5. Upload Parquet files as a downloadable GitHub Actions artifact
      #
      # After this workflow completes:
      #   GitHub → Actions → this run → scroll to "Artifacts" at the bottom
      #   → Download "trainingflow-parquet-export"
      #   → Unzip and upload the .parquet files to Databricks:
      #       Catalog → trainingflow_bronze schema → raw_uploads volume → Upload
      # -----------------------------------------------------------------------
      - name: Upload Parquet files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trainingflow-parquet-export
          path: parquet_output/
          retention-days: 7

      - name: Report success
        if: success()
        run: |
          echo "✅ Export complete at $(date -u)"
          echo "Download the artifact from the Actions run summary page."
          echo "Then upload the .parquet files to Databricks Unity Catalog Volumes."
