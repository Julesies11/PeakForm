name: TrainingFlow — Export Supabase to Databricks

on:
  # Run at 11:30 UTC daily (19:30 AWST / 7:30 PM Perth)
  schedule:
    - cron: "30 11 * * *"

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  export:
    name: Export Supabase Tables → Databricks Volume & Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r trainingflow-analytics/ingestion/requirements.txt

      - name: Export Supabase tables to Databricks
        env:
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          DATABRICKS_HOST:     ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN:    ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG:  ${{ secrets.DATABRICKS_CATALOG }}
          OUTPUT_DIR:          parquet_output
        run: |
          python trainingflow-analytics/ingestion/export_to_databricks.py

      - name: Upload Parquet files as artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: trainingflow-parquet-export
          path: parquet_output/
          retention-days: 7

      - name: Report success
        if: success()
        run: |
          echo "✅ Export & Databricks upload complete at $(date -u)"
